  --card-shadow-hover: 0 14px 28px -8px rgba(0,0,0,0.55);
}
.tk-card { transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease; box-shadow: var(--card-shadow); }
.tk-card:hover { transform: translateY(-3px) scale(1.012); box-shadow: var(--card-shadow-hover); border-color: var(--blue-soft) !important; }
.tk-theme-btn { transition: background-color 0.15s ease, transform 0.15s ease; }
.tk-theme-btn:hover { transform: rotate(-8deg); }

:root { --font-ui: 'Archivo', 'Segoe UI', system-ui, -apple-system, sans-serif; --font-code: 'IBM Plex Mono', Consolas, 'Courier New', monospace; }
body, input, button, select, textarea { font-family: var(--font-ui); }
body { font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h2 { letter-spacing: -0.01em; font-stretch: 108%; }
input::placeholder { color: var(--ink-soft); opacity: .65; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent) !important; outline-offset: 2px; border-radius: 4px; }

/* header crane: the load is lowered, held, and lifted again */
.tk-crane .tk-crane-rope { transform-box: view-box; transform-origin: 18px 4.5px; animation: tk-rope 6.5s ease-in-out infinite; }
.tk-crane .tk-crane-load { animation: tk-load 6.5s ease-in-out infinite; }
.tk-crane .tk-crane-trolley { animation: tk-trolley 6.5s ease-in-out infinite; }
@keyframes tk-rope    { 0%,12% { transform: scaleY(1); } 38%,55% { transform: scaleY(1.75); } 80%,100% { transform: scaleY(1); } }
@keyframes tk-load    { 0%,12% { transform: translateY(0); } 38%,55% { transform: translateY(3.75px); } 80%,100% { transform: translateY(0); } }
@keyframes tk-trolley { 0%,80% { transform: translateX(0); } 90% { transform: translateX(-3px); } 100% { transform: translateX(0); } }

/* stage / problem / tool cards: the icon nods when the card is pointed at */
.tk-card .lucide { transition: transform .25s ease; }
.tk-card:hover .lucide { transform: translateY(-1px) rotate(-8deg); }

/* moving between screens */
.tk-view { animation: tk-in .32s cubic-bezier(.2,.7,.2,1) both; }
@keyframes tk-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* a result value that has just changed settles into place */
.tk-value { animation: tk-settle .38s ease-out both; }
@keyframes tk-settle { from { opacity: .2; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* warnings inside results pulse gently so they are not missed */
td .lucide-triangle-alert, .tk-warn .lucide-triangle-alert { transform-origin: center; animation: tk-pulse 1.8s ease-in-out infinite; }
@keyframes tk-pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.22); opacity: .65; } }


/* ---------- card symbols (problems and tools) ---------- */
.tk-ic svg { display: block; overflow: visible; }
.tk-ic svg * { transform-box: fill-box; transform-origin: center; }
.tk-card:hover .tk-ic svg * { animation-duration: 1.6s !important; }
.tk-draw { stroke-dasharray: 24; stroke-dashoffset: 24; animation: tk-draw 3.4s ease-in-out infinite; }
@keyframes tk-draw { 0% { stroke-dashoffset: 24; } 45%, 78% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -24; } }
.tk-late { animation: tk-late 3.4s ease-in-out infinite; }
@keyframes tk-late { 0%, 35% { opacity: 0; } 45%, 78% { opacity: 1; } 100% { opacity: 0; } }
.tk-aim { animation: tk-aim 3s ease-in-out infinite; }
@keyframes tk-aim { 0%,100% { transform: translate(0,0); } 25% { transform: translate(4px,-3px); } 50% { transform: translate(-3px,2.5px); } 75% { transform: translate(1.5px,3px); } }
.tk-near-r { animation: tk-near-r 2.6s ease-in-out infinite; } .tk-near-l { animation: tk-near-l 2.6s ease-in-out infinite; }
@keyframes tk-near-r { 0%,100% { transform: translateX(-1.2px); } 50% { transform: translateX(.6px); } }
@keyframes tk-near-l { 0%,100% { transform: translateX(1.2px); } 50% { transform: translateX(-.6px); } }
.tk-blink { animation: tk-blink 1.6s ease-in-out infinite; }
@keyframes tk-blink { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
.tk-spike { transform-origin: bottom center !important; animation: tk-spike 2.4s cubic-bezier(.3,1.6,.5,1) infinite; }
@keyframes tk-spike { 0%,20% { transform: scaleY(1); } 35%,70% { transform: scaleY(1.85); } 90%,100% { transform: scaleY(1); } }
.tk-drive { animation: tk-drive 2.2s ease-in-out infinite; }
@keyframes tk-drive { 0%,100% { transform: translateX(-1.2px); } 50% { transform: translateX(1.2px) translateY(-.4px); } }
.tk-road { animation: tk-road 1s linear infinite; }
@keyframes tk-road { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 6; } }
.tk-drop { animation: tk-drop 2.4s ease-in infinite; }
@keyframes tk-drop { 0% { transform: translateY(-2px) rotate(0); opacity: 0; } 15% { opacity: 1; } 70% { transform: translateY(8px) rotate(25deg); opacity: 1; } 100% { transform: translateY(10px) rotate(30deg); opacity: 0; } }
.tk-coin { animation: tk-coin 2.4s ease-in infinite; }
@keyframes tk-coin { 0% { transform: translateY(-2px); opacity: 0; } 20% { opacity: 1; } 65% { transform: translateY(6.6px); opacity: 1; } 80%,100% { transform: translateY(6.6px); opacity: 0; } }
.tk-sweep { transform-box: view-box !important; transform-origin: 12px 12px !important; animation: tk-rot 2.8s linear infinite; }
@keyframes tk-rot { to { transform: rotate(360deg); } }
.tk-spin { animation: tk-rot 2.4s linear infinite; }
.tk-flip { transform-box: view-box !important; transform-origin: 12px 12px !important; animation: tk-flip 3.2s ease-in-out infinite; }
@keyframes tk-flip { 0%,70% { transform: rotate(0); } 90%,100% { transform: rotate(180deg); } }
.tk-dot1, .tk-dot2, .tk-dot3 { animation: tk-type 1.3s ease-in-out infinite; }
.tk-dot2 { animation-delay: .18s; } .tk-dot3 { animation-delay: .36s; }
@keyframes tk-type { 0%,60%,100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-2px); opacity: 1; } }
.tk-flow { animation: tk-road .9s linear infinite reverse; }
.tk-grow1, .tk-grow2, .tk-grow3 { transform-origin: left center !important; animation: tk-grow 3s ease-in-out infinite; }
.tk-grow2 { animation-delay: .2s; } .tk-grow3 { animation-delay: .4s; }
@keyframes tk-grow { 0%,100% { transform: scaleX(.35); } 40%,70% { transform: scaleX(1); } }
.tk-beat { animation: tk-beat 1.6s ease-in-out infinite; }
@keyframes tk-beat { 0%,100% { transform: scale(1); } 20% { transform: scale(1.25); } 40% { transform: scale(.95); } }
.tk-swap-r { animation: tk-swap-r 2.4s ease-in-out infinite; } .tk-swap-l { animation: tk-swap-l 2.4s ease-in-out infinite; }
@keyframes tk-swap-r { 0%,100% { transform: translateX(-1.5px); } 50% { transform: translateX(1.5px); } }
@keyframes tk-swap-l { 0%,100% { transform: translateX(1.5px); } 50% { transform: translateX(-1.5px); } }
.tk-tilt { transform-box: view-box !important; transform-origin: 12px 6px !important; animation: tk-tilt 3s ease-in-out infinite; }
@keyframes tk-tilt { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
.tk-land { animation: tk-land 2.6s cubic-bezier(.3,1.5,.55,1) infinite; }
@keyframes tk-land { 0% { transform: translateY(-5px); opacity: 0; } 25% { opacity: 1; } 45%,85% { transform: translateY(2px); opacity: 1; } 100% { transform: translateY(2px); opacity: 0; } }
.tk-bar-a, .tk-bar-b { transform-origin: bottom center !important; animation: tk-bar 2.6s ease-in-out infinite; }
.tk-bar-b { animation-delay: -1.3s; }
@keyframes tk-bar { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.55); } }
.tk-rope { transform-box: view-box !important; transform-origin: 18px 4.5px !important; animation: tk-rope 4.5s ease-in-out infinite; }
.tk-hook { animation: tk-load 4.5s ease-in-out infinite; }
.tk-scan { animation: tk-scan 3.6s ease-in-out infinite; }
@keyframes tk-scan { 0%,100% { transform: translate(0,0); } 33% { transform: translate(5px,1.5px); } 66% { transform: translate(2px,4px); } }
.tk-lid { transform-box: view-box !important; transform-origin: 4px 7px !important; animation: tk-lid 2.6s ease-in-out infinite; }
@keyframes tk-lid { 0%,55%,100% { transform: rotate(0); } 20%,40% { transform: rotate(-28deg); } }
.tk-tick1, .tk-tick2 { stroke-dasharray: 10; stroke-dashoffset: 10; animation: tk-tick 3s ease-in-out infinite; }
.tk-tick2 { animation-delay: .5s; }
@keyframes tk-tick { 0%,10% { stroke-dashoffset: 10; } 35%,85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 10; } }
.tk-pop1, .tk-pop2, .tk-pop3 { animation: tk-pop 3s ease-in-out infinite; }
.tk-pop2 { animation-delay: .25s; } .tk-pop3 { animation-delay: .5s; }
@keyframes tk-pop { 0%,8% { transform: translateX(-3px); opacity: 0; } 25%,80% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(2px); opacity: 0; } }
.tk-needle { transform-box: view-box !important; transform-origin: 12px 17px !important; animation: tk-needle 3s ease-in-out infinite; }
@keyframes tk-needle { 0%,100% { transform: rotate(-95deg); } 45% { transform: rotate(15deg); } 60% { transform: rotate(0deg); } }
.tk-ring { transform-box: view-box !important; transform-origin: 12px 4px !important; animation: tk-ring 2.4s ease-in-out infinite; }
@keyframes tk-ring { 0%,40%,100% { transform: rotate(0); } 8% { transform: rotate(14deg); } 16% { transform: rotate(-12deg); } 24% { transform: rotate(8deg); } 32% { transform: rotate(-5deg); } }
.tk-rise { animation: tk-rise 2.2s ease-in-out infinite; }
@keyframes tk-rise { 0%,100% { transform: translateY(1.5px); } 50% { transform: translateY(-1.5px); } }
.tk-write { animation: tk-write 2s ease-in-out infinite; }
@keyframes tk-write { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-1.6px,1px); } 50% { transform: translate(0,1.6px); } 75% { transform: translate(-1px,.4px); } }
.tk-star { animation: tk-star 2.4s ease-in-out infinite; }
@keyframes tk-star { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-1.5px) scale(1.18) rotate(18deg); } }
.tk-print { animation: tk-print 2.8s ease-in-out infinite; }
@keyframes tk-print { 0% { transform: translateY(-3px); opacity: 0; } 25% { opacity: 1; } 60%,85% { transform: translateY(1.5px); opacity: 1; } 100% { transform: translateY(2.5px); opacity: 0; } }
.tk-hop { animation: tk-hop 4s ease-in-out infinite; }
@keyframes tk-hop { 0%,15% { transform: translate(0,0); } 25%,40% { transform: translate(8.4px,0); } 50%,65% { transform: translate(8.4px,-8.4px); } 75%,90% { transform: translate(0,-8.4px); } 100% { transform: translate(0,0); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
